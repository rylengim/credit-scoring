[project]
name = "credit-scoring"
version = "0.1.0"
description = "Reproducible credit-risk prototype with Streamlit and FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit==1.48.1",
    "requests==2.32.5",
    "fastapi==0.116.1",
    "pydantic==2.11.7",
    "uvicorn==0.35.0",
    "scikit-learn==1.7.1",
    "pandas==2.3.2",
    "joblib==1.5.1",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1"]
